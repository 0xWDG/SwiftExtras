name: Run platform tests
on:
  push:
  workflow_dispatch:

jobs:
  test_linux:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Test Linux
        run: Scripts/test-all-platforms.sh

  test_apple_platforms:
    runs-on: macos-15
    # runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: "Select Xcode (Default)"
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Runner environment
        run: |
          echo "MacOS Version"
          sw_vers
          echo "Toolchain version"
          swift -version

      - name: Test supported Apple platforms
        run: SKIP_LINUX=1 Scripts/test-all-platforms.sh
